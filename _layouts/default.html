<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="light">
  <head>
    {% include head.html %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="site-shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}">Nick</a>
        {% include navigation.html %}
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme" aria-pressed="false">
          <span data-theme-label>Light</span>
        </button>
      </div>
    </header>

    <main class="site-shell page-shell" id="main-content">
      {{ content }}
    </main>

    {% include footer.html %}
    <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  </body>
</html>
