<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf7f2">
{% assign meta_title = page.title | append: " · " | append: site.title %}
{% assign meta_description = page.description | default: site.description %}
<title>{% if page.title == "Home" %}{{ site.title | escape }}{% else %}{{ meta_title | escape }}{% endif %}</title>
<meta name="description" content="{{ meta_description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{% if page.title == 'Home' %}{{ site.title | escape }}{% else %}{{ meta_title | escape }}{% endif %}">
<meta property="og:description" content="{{ meta_description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:card" content="summary">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<script>
  (() => {
    let savedTheme = null;
    try {
      savedTheme = localStorage.getItem("portfolio-theme");
    } catch (_error) {
      // Continue with the system preference when storage is unavailable.
    }
    const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme =
      savedTheme === "light" || savedTheme === "dark"
        ? savedTheme
        : systemPrefersDark
          ? "dark"
          : "light";
  })();
</script>
